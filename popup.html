<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHD Focus Coach</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      /* Tailwind Slate-900 */
      color: #f8fafc;
      /* Slate-50 */
      width: 320px;
      height: 380px;
      /* Fixed height for consistent layout */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Branding Row */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 20px 10px 20px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 20px;
      height: 20px;
      color: #60a5fa;
      /* Calming Blue */
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    /* Main Scrollable View Area */
    main {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 56px;
      /* Leave space for bottom tab bar */
    }

    /* Custom thin scrollbars for lists */
    main::-webkit-scrollbar {
      width: 4px;
    }

    main::-webkit-scrollbar-track {
      background: transparent;
    }

    main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
    }

    /* Component cards */
    .card {
      background: rgba(30, 41, 59, 0.45);
      /* Slate-800 translucent */
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* INPUT FIELDS */
    .task-input-container {
      position: relative;
    }

    .task-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #f8fafc;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .task-input:focus {
      border-color: #60a5fa;
      background: rgba(15, 23, 42, 0.8);
    }

    .task-input::placeholder {
      color: #475569;
    }

    /* GLOBAL PROTECTION TOGGLE */
    .switch-container {
      display: inline-flex;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      display: none;
      /* Hide default checkbox rendering */
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #94a3b8;
      transition: .25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.35);
    }

    input:checked+.slider:before {
      transform: translateX(18px);
      background-color: #60a5fa;
      box-shadow: 0 0 6px rgba(96, 165, 250, 0.4);
    }

    /* SENSITIVITY SLIDER */
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 12px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-value {
      font-size: 11px;
      font-weight: 600;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(96, 165, 250, 0.15);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      margin: 8px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #60a5fa;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(96, 165, 250, 0.4);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      font-weight: 500;
    }

    /* BLACKLIST / ZONES TAB STYLES */
    .active-site-box {
      border: 1px solid rgba(96, 165, 250, 0.15);
      background: rgba(96, 165, 250, 0.02);
    }

    .active-site-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .active-host {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-quick-toggle {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      background: transparent;
      transition: all 0.2s ease;
    }

    .btn-quick-toggle.is-restricted {
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.1);
    }

    .btn-quick-toggle.is-restricted:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .btn-quick-toggle.is-allowed {
      color: #60a5fa;
      border-color: rgba(96, 165, 250, 0.25);
    }

    .btn-quick-toggle.is-allowed:hover {
      background: rgba(96, 165, 250, 0.05);
    }

    /* List Add Form inside Zones */
    .add-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .add-row input {
      flex: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: #ffffff;
      outline: none;
    }

    .add-row input:focus {
      border-color: #60a5fa;
    }

    .btn-add {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-add:hover {
      background: #1d4ed8;
    }

    /* Zones Scroll list with expanded height */
    .blacklist-scroll-area {
      max-height: 130px;
      /* Increased to comfortably show expanded panels */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 6px;
    }

    .blacklist-scroll-area::-webkit-scrollbar {
      width: 3px;
    }

    .blacklist-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1.5px;
    }

    /* EXPANDABLE ACCORDION CARD STYLES */
    .blacklist-item {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      overflow: hidden;
      transition: background 0.2s ease, border-color 0.2s ease;
      flex-shrink: 0;
      /* CRITICAL: Prevents flex layout from compressing list cards */
    }

    .blacklist-item:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.04);
    }

    .blacklist-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }

    .domain-name {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
      transition: opacity 0.2s ease;
    }

    .chevron-icon {
      width: 14px;
      height: 14px;
      color: #475569;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s ease;
      flex-shrink: 0;
    }

    /* Rotation & coloration when expanded */
    .blacklist-item.expanded {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(96, 165, 250, 0.15);
    }

    .blacklist-item.expanded .chevron-icon {
      transform: rotate(180deg);
      color: #60a5fa;
    }

    /* Details Drawer Panel */
    .blacklist-item-body {
      background: rgba(15, 23, 42, 0.2);
      overflow: hidden;
      transition: max-height 0.25s ease-out;
    }

    .item-menu {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      /* Shifted border inside wrapper to prevent line leaks when collapsed */
    }

    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-row span {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Symmetrical switch styles */
    .switch-small {
      position: relative;
      display: inline-block;
      width: 28px !important;
      height: 16px !important;
      flex-shrink: 0;
    }

    .switch-small input {
      display: none;
    }

    .slider-small {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: .2s ease;
      border-radius: 16px;
    }

    .slider-small:before {
      position: absolute;
      content: "";
      height: 10px;
      width: 10px;
      left: 2px;
      bottom: 2px;
      background-color: #64748b;
      transition: .2s ease;
      border-radius: 50%;
    }

    input:checked+.slider-small {
      background-color: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.25);
    }

    input:checked+.slider-small:before {
      transform: translateX(12px);
      background-color: #60a5fa;
      box-shadow: 0 0 4px rgba(96, 165, 250, 0.3);
    }

    /* Calm Delete button inside drawer */
    .btn-remove-small {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: rgba(252, 165, 165, 0.85);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-remove-small:hover {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      transform: translateY(-0.5px);
    }

    .btn-remove-small svg {
      width: 11px;
      height: 11px;
    }

    /* Encouragement Card */
    .analytics-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.06) 0%, rgba(99, 102, 241, 0.06) 100%);
      border: 1px dashed rgba(96, 165, 250, 0.15);
      text-align: center;
      padding: 10px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .analytics-number {
      font-size: 18px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: -0.5px;
    }

    .analytics-text {
      font-size: 10px;
      color: #64748b;
      font-weight: 500;
    }

    /* BOTTOM TAB BAR NAVIGATION */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: #1e293b;
      /* Slate-800 */
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #64748b;
      /* unselected tab Slate-500 */
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 33.33%;
      height: 100%;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: all 0.2s ease;
    }

    .tab-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
      transition: stroke 0.2s ease;
    }

    .tab-btn:hover {
      color: #94a3b8;
    }

    .tab-btn.active {
      color: #60a5fa;
      /* Calming active Blue */
    }

    /* Page Toggling Utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
      </svg>
      <span class="brand-title">Focus Coach</span>
    </div>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="protection-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- Subpages Area -->
  <main>
    <!-- PAGE 1: FOCUS -->
    <section id="tab-focus-page" class="subpage">
      <div class="card">
        <span class="card-label">My Current Focus</span>
        <div class="task-input-container">
          <input type="text" id="task-input" class="task-input" placeholder="e.g. Finish writing report"
            autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="analytics-card" style="margin-top: 10px;">
        <span class="analytics-number" id="refocus-counter">0</span>
        <span class="analytics-text">Encouraged refocuses completed today!</span>
      </div>
    </section>

    <!-- PAGE 2: SENSITIVITY -->
    <section id="tab-sensitivity-page" class="subpage hidden">
      <div class="card slider-group">
        <div class="slider-header">
          <span class="card-label">Sensitivity</span>
          <span id="slider-val-label" class="slider-value">Balanced</span>
        </div>
        <input type="range" id="sensitivity-slider" min="1" max="3" value="2" step="1">
        <div class="slider-labels">
          <span>Lenient</span>
          <span>Balanced</span>
          <span>Strict</span>
        </div>
      </div>
    </section>

    <!-- PAGE 3: ZONES (BLACKLIST) -->
    <section id="tab-zones-page" class="subpage hidden">
      <div class="card active-site-box">
        <span class="card-label" id="active-site-label">Checking Current Page...</span>
        <div class="active-site-info">
          <span class="active-host" id="active-host">No active page</span>
          <button class="btn-quick-toggle is-restricted" id="btn-quick-toggle" style="display: none;">Restrict</button>
        </div>
      </div>

      <div class="card" style="padding-top: 10px;">
        <span class="card-label">Restricted Zones</span>
        <form id="add-form" class="add-row">
          <input type="text" id="manual-domain-input" placeholder="e.g. reddit.com" required autocomplete="off">
          <button type="submit" class="btn-add">Add</button>
        </form>
        <div class="blacklist-scroll-area" id="blacklist-scroll-area">
          <!-- Injected programmatically -->
        </div>
      </div>
    </section>
  </main>

  <!-- Navigation Bar Footer -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-page="tab-focus-page">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
      Focus
    </button>
    <button class="tab-btn" data-page="tab-sensitivity-page">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
      </svg>
      Rules
    </button>
    <button class="tab-btn" data-page="tab-zones-page">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z" />
      </svg>
      Zones
    </button>
  </nav>

  <script src="popup.js"></script>
</body>

</html>
